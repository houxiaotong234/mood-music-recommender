<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mood Music Recommender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: min(800px, 100%);
      padding: 32px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .language-button {
      float: right;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      font: inherit;
      font-weight: bold;
    }

    .language-button:hover,
    .language-button:focus-visible {
      background: rgba(0, 0, 0, 0.35);
      outline: 2px solid #ffd166;
      outline-offset: 2px;
    }

    h1 {
      margin-top: 0;
    }

    .moods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 28px 0;
    }

    .mood-button {
      width: 105px;
      min-height: 108px;
      padding: 10px;
      border: 3px solid transparent;
      border-radius: 18px;
      color: #222;
      background: #fff;
      cursor: pointer;
      transition:
        transform 0.2s,
        border-color 0.2s,
        background-color 0.2s;
    }

    .mood-button:hover,
    .mood-button:focus-visible {
      transform: translateY(-5px);
      border-color: #ffd166;
      outline: none;
    }

    .mood-button.selected {
      border-color: #ffd166;
      background: #fff3bd;
      transform: translateY(-5px);
    }

    .emoji {
      display: block;
      font-size: 42px;
    }

    .mood-name {
      display: block;
      margin-top: 6px;
      font-weight: bold;
    }

    .checkmark {
      display: block;
      min-height: 18px;
      margin-top: 4px;
      color: #157347;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
      gap: 14px;
      margin-bottom: 26px;
    }

    .number-control {
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
      font-weight: bold;
    }

    select,
    .action-button {
      min-height: 44px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font: inherit;
    }

    select {
      color: #222;
      background: #fff;
      cursor: pointer;
    }

    .action-button {
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .action-button:hover {
      transform: translateY(-2px);
    }

    .recommend-button {
      color: #222;
      background: #ffd166;
    }

    .clear-button {
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      font-weight: bold;
    }

    .error {
      color: #fff3bd;
    }

    .recommendations {
      display: grid;
      gap: 18px;
      text-align: left;
    }

    .mood-results {
      padding: 20px;
      border-radius: 16px;
      color: #222;
      background: #fff;
    }

    .mood-results h2 {
      margin: 0 0 14px;
      color: #6441a5;
    }

    .song-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 28px;
    }

    .song-list li {
      padding-left: 4px;
    }

    .song-actions {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .song-action,
    .utility-button {
      padding: 5px 8px;
      border: 0;
      border-radius: 7px;
      color: #222;
      background: #ffd166;
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
    }

    .song-action:hover,
    .utility-button:hover {
      filter: brightness(0.95);
    }

    .song-action.favorite {
      color: #fff;
      background: #6441a5;
    }

    .utility-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 0 0 20px;
    }

    .history-panel {
      display: none;
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 14px;
      color: #222;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
    }

    .history-panel.visible { display: block; }
    .history-panel h2 { margin: 0 0 8px; color: #6441a5; font-size: 1.05rem; }
    .history-panel ul { margin: 0; padding-left: 20px; }

    .song-title {
      font-weight: bold;
    }

    .artist {
      color: #555;
    }

    @media (max-width: 540px) {
      .container {
        padding: 24px 16px;
      }

      .mood-button {
        width: 96px;
      }

      .controls,
      .number-control,
      select,
      .action-button {
        width: 100%;
      }
    }
  </style>
</head>

      </button>

      <button class="mood-button" data-mood="romantic" aria-pressed="false">
        <span class="emoji">😍</span>
        <span class="mood-name" data-mood-label="romantic">Romantic</span>
        <span class="checkmark" aria-hidden="true"></span>
      </button>

      <button class="mood-button" data-mood="focus" aria-pressed="false">
        <span class="emoji">🎯</span>
        <span class="mood-name" data-mood-label="focus">Focus</span>
        <span class="checkmark" aria-hidden="true"></span>

      <button class="mood-button" data-mood="nostalgic" aria-pressed="false">

        <span class="mood-name" data-mood-label="nostalgic">Nostalgic</span>
        <span class="checkmark" aria-hidden="true"></span>

    </div>

    <div class="controls">
      <label class="number-control" for="songCount">

        <select id="songCount">

        </select>
      </label>

      <button class="action-button recommend-button" id="recommendButton">
        <span data-i18n="recommend">Recommend Songs</span>
      </button>

      <button class="action-button clear-button" id="clearButton">
        <span data-i18n="clear">Clear Selection</span>
      </button>
    </div>

    <div class="utility-row">
      <button class="utility-button" id="timeButton" type="button" data-i18n="timeRecommend">Recommend for this time</button>
      <button class="utility-button" id="mixButton" type="button" data-i18n="mixSongs">Chinese + English</button>
      <button class="utility-button" id="historyButton" type="button" data-i18n="history">Recommendation history</button>
      <button class="utility-button" id="favoritesButton" type="button" data-i18n="favorites">My favorites</button>
    </div>

    <section class="history-panel" id="historyPanel" aria-live="polite"></section>

    <p class="status" id="status" aria-live="polite">

    </p>

    <section

      id="recommendations"
      aria-label="Song recommendations"
      aria-live="polite"
    ></section>
  </main>

      });
      languageButton.textContent = text("languageButton");
      timeButton.textContent = text("timeRecommend");
      mixButton.textContent = mixedMode ? `${text("mixSongs")} ✓` : text("mixSongs");
      historyButton.textContent = text("history");
      favoritesButton.textContent = text("favorites");
      moodButtons.forEach((button) => {
        button.querySelector(".checkmark").textContent = selectedMoods.has(button.dataset.mood) ? text("selectedMark") : "";
      });
      updateStatus();
    }

    languageButton.addEventListener("click", () => {
      language = language === "en" ? "zh" : "en";
      applyLanguage();
    });

    function persist() {
      localStorage.setItem("moodMusicFavorites", JSON.stringify(favorites));
      localStorage.setItem("moodMusicHistory", JSON.stringify(history.slice(0, 30)));
    }

    function songKey(song) { return `${song.title}|||${song.artist}`; }
    function isFavorite(song) { return favorites.some((item) => songKey(item) === songKey(song)); }
    function openSearch(song, site) {
      const query = encodeURIComponent(`${song.title} ${song.artist}`);
      const url = site === "qq" ? `https://y.qq.com/n/ryqq/search?w=${query}` : `https://music.163.com/#/search/m/?s=${query}&type=1`;
      window.open(url, "_blank", "noopener");
    }
    function toggleFavorite(song, button) {
      const index = favorites.findIndex((item) => songKey(item) === songKey(song));
      if (index >= 0) favorites.splice(index, 1); else favorites.unshift(song);
      persist();
      button.textContent = isFavorite(song) ? `★ ${text("saved")}` : `☆ ${text("save")}`;
    }
    function showPanel(type) {
      const items = type === "favorites" ? favorites : history;
      historyPanel.classList.add("visible");
      historyPanel.replaceChildren();
      const heading = document.createElement("h2");
      heading.textContent = type === "favorites" ? text("favoritesTitle") : text("historyTitle");
      historyPanel.appendChild(heading);
      if (!items.length) { historyPanel.appendChild(document.createTextNode(type === "favorites" ? text("emptyFavorites") : text("emptyHistory"))); return; }
      const list = document.createElement("ul");
      items.slice(0, 12).forEach((song) => { const item = document.createElement("li"); item.textContent = `${song.title} — ${song.artist}`; list.appendChild(item); });
      historyPanel.appendChild(list);
    }

    historyButton.addEventListener("click", () => showPanel("history"));
    favoritesButton.addEventListener("click", () => showPanel("favorites"));
    mixButton.addEventListener("click", () => { mixedMode = !mixedMode; applyLanguage(); });
    timeButton.addEventListener("click", () => {
      const hour = new Date().getHours();
      selectedMoods.clear();
      selectedMoods.add(hour < 7 || hour >= 22 ? "calm" : hour < 12 ? "focus" : hour < 18 ? "energetic" : "happy");
      moodButtons.forEach((button) => { const active = selectedMoods.has(button.dataset.mood); button.classList.toggle("selected", active); button.setAttribute("aria-pressed", String(active)); button.querySelector(".checkmark").textContent = active ? text("selectedMark") : ""; });
      updateStatus();
      recommendButton.click();
    });

    // Select or deselect multiple moods.
    moodButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const mood = button.dataset.mood;

        if (selectedMoods.has(mood)) {
          selectedMoods.delete(mood);
          button.classList.remove("selected");
          button.setAttribute("aria-pressed", "false");
          button.querySelector(".checkmark").textContent = "";
        } else {
          selectedMoods.add(mood);
          button.classList.add("selected");
          button.setAttribute("aria-pressed", "true");
          button.querySelector(".checkmark").textContent = text("selectedMark");
        }

        updateStatus();
      });
    });

    // Return a requested number of random, non-repeating items.
    function getRandomSongs(songList, amount) {
      const shuffled = [...songList];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] =
          [shuffled[randomIndex], shuffled[i]];
      }

      return shuffled.slice(0, amount);
    }

    function updateStatus() {
      status.classList.remove("error");

      if (selectedMoods.size === 0) {
        status.textContent = text("noMoods");
        return;
      }

      const names = [...selectedMoods].map(
        (mood) => `${moodDetails[mood].emoji} ${moodLabel(mood)}`
      );

      status.textContent =
        `${selectedMoods.size} ${text("selected")}: ` +
        names.join(", ");
    }

    recommendButton.addEventListener("click", () => {
      recommendations.replaceChildren();

      if (selectedMoods.size === 0) {
        status.textContent = text("selectPrompt");
        status.classList.add("error");
        return;
      }

      const amount = Number(songCount.value);

      selectedMoods.forEach((mood) => {
        const sourceSongs = mixedMode ? [...chineseSongs[mood], ...songs[mood]] : language === "zh" ? chineseSongs[mood] : songs[mood];
        const chosenSongs = getRandomSongs(sourceSongs, amount);
        const section = document.createElement("article");
        const heading = document.createElement("h2");
        const list = document.createElement("ol");

        section.className = "mood-results";
        list.className = "song-list";

        heading.textContent =
          `${moodDetails[mood].emoji} ${moodLabel(mood)}`;

        chosenSongs.forEach((song) => {
          const item = document.createElement("li");
          const title = document.createElement("span");
          const artist = document.createElement("span");
          const actions = document.createElement("span");
          const searchButton = document.createElement("button");
          const previewButton = document.createElement("button");
          const favoriteButton = document.createElement("button");

          title.className = "song-title";
          artist.className = "artist";

          title.textContent = song.title;
          artist.textContent = ` — ${song.artist}`;

          actions.className = "song-actions";
          searchButton.className = "song-action";
          searchButton.type = "button";
          searchButton.textContent = `♫ ${text("search")}`;
          searchButton.addEventListener("click", () => openSearch(song, "qq"));
          previewButton.className = "song-action";
          previewButton.type = "button";
          previewButton.textContent = `▶ ${text("preview")}`;
          previewButton.addEventListener("click", () => openSearch(song, "163"));
          favoriteButton.className = `song-action${isFavorite(song) ? " favorite" : ""}`;
          favoriteButton.type = "button";
          favoriteButton.textContent = isFavorite(song) ? `★ ${text("saved")}` : `☆ ${text("save")}`;
          favoriteButton.addEventListener("click", () => toggleFavorite(song, favoriteButton));
          actions.append(searchButton, previewButton, favoriteButton);

          item.append(title, artist, actions);
          list.appendChild(item);
          history.unshift({ ...song, mood, recommendedAt: Date.now() });
        });

        section.append(heading, list);
        recommendations.appendChild(section);
      });

      const total = selectedMoods.size * amount;

      status.classList.remove("error");
      status.textContent = `${text("showing")} ${total} ${total === 1 ? text("song") : text("songs")} ${text("across")} ${selectedMoods.size} ${text("moods")}.`;
      persist();
      historyButton.textContent = text("history");
    });

    clearButton.addEventListener("click", () => {
      selectedMoods.clear();
      recommendations.replaceChildren();

      moodButtons.forEach((button) => {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
        button.querySelector(".checkmark").textContent = "";
      });

      updateStatus();
    });
  </script>
</body>
</html>
